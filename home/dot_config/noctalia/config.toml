[osd]
offset_y = 80
position = "bottom_center"

[plugin_settings."ashur-d/wallpaper-widget"]
close_on_apply = true

[plugin_settings."cleboost/zed-provider"]
new_window = true

[plugin_settings."noctalia/mpvpaper"]
picker_placement = "floating"
video_directory = "/home/ash/.local/share/Steam/steamapps/workshop/content/431960/1439593106"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
hide_inactive = true
video_source = "focused"

[plugin_settings."tadomika_ari/w-engine"]
grid_columns = 3

[plugin_settings."tordex/processes"]
panel_placement = "floating"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "cleboost/zed-provider",
    "ashur-d/arch-packages",
    "ashur-d/wallpaper-widget",
    "ashur-d/nvim-projects"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/ash/Pictures/wallpapers/wallpapers/wallpaper22.jpg"
font_family = "Maple Mono"
panel_anchor_bar = "main"
settings_window_translucent = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    categories = false
    fetch_exchange_rates = false
    layout = "simple"

    [shell.mpris]
    blacklist = [ "helium" ]

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "auto"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    annotate = true
    pipe_command = ""
    pipe_to_command = false

    [shell.session]
    show_shortcuts = false

[theme]
builtin = "Gruvbox"
community_palette = "Cream Autumn"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "starship" ]
    enable_builtin_templates = true
    community_ids = [ "fastfetch", "yazi" ]
    enable_community_templates = true

[wallpaper]
directory = "/home/ash/Pictures/wallpapers/wallpapers"
directory_dark = "/home/ash/Pictures/wallpapers/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ash/Pictures/wallpapers/wallpapers/Crystal Cave with Glowing Mushrooms.png"

    [wallpaper.last]
    path = "/home/ash/Pictures/wallpapers/wallpapers/Crystal Cave with Glowing Mushrooms.png"

    [wallpaper.monitors.DP-1]
    path = "/home/ash/Pictures/wallpapers/wallpapers/Crystal Cave with Glowing Mushrooms.png"

[widget.clock]
format = "{:L%A %I:%M}"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
detached_panel = true
drawer = true
hide_passive = false
match_adjacent_spacing = true

[widget.workspaces]
show_labels = false

    [widget.workspaces.actions]
    right = "wallpaper-random"
