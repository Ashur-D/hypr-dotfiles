[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.0
    capsule = true
    capsule_opacity = 0.59999998658895493
    capsule_padding = 18.0
    capsule_thickness = 0.99999998137354851
    center = [ "workspaces" ]
    end = [ "group:g1" ]
    font_family = "Maple Mono"
    margin_edge = 5
    margin_ends = 5
    padding = 0
    start = [ "group:g2" ]
    thickness = 37

        [bar.main.dead_zone.actions]
        left = "wallpaper-next"

        [[bar.main.capsule_group]]
        accordion = true
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g1"
        members = [ "media", "tray" ]
        opacity = 0.60000002384185791
        padding = 18.0

        [[bar.main.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border = ""
        enabled = true
        fill = "surface_variant"
        foreground = "secondary"
        id = "g2"
        members = [ "clock", "recorder" ]
        opacity = 0.60000002384185791
        padding = 18.0

